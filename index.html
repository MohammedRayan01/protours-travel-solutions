<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Every load/reload lands on the hero, never at the browser's
      // remembered scroll position — this must run before first paint,
      // ahead of the app bundle, so there's no visible jump.
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' })
    </script>
    <title>Pro Tours &amp; Travel Solutions | One Stop Travel Solutions, Bengaluru</title>
    <meta name="description" content="One stop travel solutions for all your travel needs. Flight booking, hotels worldwide, tailor-made packages, tour packages, visa, passport, cruises and Umrah — from Shivaji Nagar, Bengaluru." />
    <meta name="theme-color" content="#04182c" />
    <meta property="og:type" content="website" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta property="og:title" content="Pro Tours &amp; Travel Solutions" />
    <meta property="og:description" content="One stop travel solutions for all your travel needs — Bengaluru's trusted travel consultants since 2009." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Typography: Cabinet Grotesk for UI + headings, Cormorant Garamond as the
         editorial accent serif (used italic for emphasis phrases and quotes). -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f%5B%5D=cabinet-grotesk@300,400,500,600,700,800,900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Marks that scripting is available. Elements that the hero timeline
         animates in are only hidden under `.js`, so if the bundle fails to
         load the content still renders instead of staying blank. -->
    <script>document.documentElement.classList.add('js')</script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
