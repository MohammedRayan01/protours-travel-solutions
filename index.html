<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Every load/reload lands on the hero, never at the browser's
      // remembered scroll position — this must run before first paint,
      // ahead of the app bundle, so there's no visible jump.
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' })
    </script>
    <title>Pro Tours &amp; Travel Solutions | Travel agency in Shivaji Nagar, Bengaluru</title>
    <meta name="description" content="A Bengaluru travel agency since 2009, and an IATA-accredited agent — flights, hotels, visas, passports, tour packages, cruises and Hajj &amp; Umrah. Walk in on Hospital Road or WhatsApp us." />
    <meta name="theme-color" content="#04182c" />
    <link rel="canonical" href="https://www.protoursandtravelsolutions.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pro Tours &amp; Travel Solutions" />
    <meta property="og:url" content="https://www.protoursandtravelsolutions.com/" />
    <meta property="og:image" content="https://www.protoursandtravelsolutions.com/logo.png" />
    <meta property="og:locale" content="en_IN" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta property="og:title" content="Pro Tours &amp; Travel Solutions | Travel agency in Shivaji Nagar, Bengaluru" />
    <meta property="og:description" content="A Bengaluru travel agency since 2009, and an IATA-accredited agent — flights, hotels, visas, passports, tour packages, cruises and Hajj &amp; Umrah." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Structured data so Google can show the business as a local
         TravelAgency (address, hours, phone). No rating is included on
         purpose: only confirmed figures may be published. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Pro Tours & Travel Solutions",
      "url": "https://www.protoursandtravelsolutions.com/",
      "logo": "https://www.protoursandtravelsolutions.com/logo.png",
      "image": "https://www.protoursandtravelsolutions.com/logo.png",
      "telephone": "+91-99005-17604",
      "email": "protours@protours.co.in",
      "foundingDate": "2009",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "21/1, G-2 Plain Street, A.M. Plaza, Ground Floor, Hospital Road, Near Infantry Road",
        "addressLocality": "Shivaji Nagar, Bengaluru",
        "addressRegion": "Karnataka",
        "postalCode": "560001",
        "addressCountry": "IN"
      },
      "openingHoursSpecification": [{
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
        "opens": "10:00",
        "closes": "20:00"
      }],
      "sameAs": ["https://www.instagram.com/protoursandtravelsolutions/"]
    }
    </script>
    <!-- Typography: Cabinet Grotesk for UI + headings, Cormorant Garamond as the
         editorial accent serif (used italic for emphasis phrases and quotes). -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f%5B%5D=cabinet-grotesk@400,500,600,700,800,900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Marks that scripting is available. Elements that the hero timeline
         animates in are only hidden under `.js`, so if the bundle fails to
         load the content still renders instead of staying blank. -->
    <script>document.documentElement.classList.add('js')</script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
